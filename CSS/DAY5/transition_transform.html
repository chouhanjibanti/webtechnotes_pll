<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        div{
            height: 200px;
            width: 200px;
            border: 1px solid;
            margin-left: 100px;
        }
        #translate-box{
            background-color: blue;
            transition: transform 5s;
        }
        #translate-box:hover{
            transform: translate3d(100px ,200px,100px);
        }
        #scale-box{
            background-color: red;
            transition: transform 10s;
        }
        #scale-box:hover{
            transform:  scale(1.2);
        }
        #rotate-box{
            background-color: peru;
            transition: transform 1s;
        }
        #rotate-box:hover{
            transform: rotate(360deg);
        }
        #skew-box{
            background-color: blueviolet;
            transition: transform 3s;
        }
        #skew-box:hover{
            transform: skew(100deg,200deg);
        }
        #short-box{
            background-color: salmon;
            transition: transform 3s;
        }
        #short-box:hover{
            transform: translate(10px ,20px) scale(1.5) rotate(360deg) skew(10deg,20deg);
        }


    </style>
</head>
<body>
    <div id="translate-box"></div> <br>
    <!-- <div id="scale-box"></div> <br> -->
    <div id="rotate-box">Hello</div> <br>
    <div id="skew-box"></div> <br>
    <div id="short-box"></div>
    <button id="scale-box">Submit</button>


</body>
</html>
