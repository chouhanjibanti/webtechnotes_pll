<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width='device-width', initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
        }

        @media screen {
            body::before{
                content: "this is for screen only";
                color: red;
            }
        }

        @media print {
            body::before{
                content: "this is only for the print";
                color: blue;
            }
        }

        @media (min-width:600px){
             body{
                background-color: green;
                color: blueviolet;
             }
        }

        @media (max-width:300px){
            body{
                background-color: aquamarine;
            }
        }

        @media (orientation: landscape){
            body{
                background-color: orange;
            }
        }
        @media (orientation: portrait){
              body{
                background-color: chartreuse;
              }
        }
    </style>
</head>
<body>
    <h1>Reponsive page design</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Illum, voluptatum!</p>
</body>
</html>
