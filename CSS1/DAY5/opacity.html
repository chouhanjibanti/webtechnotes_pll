<!DOCTYPE html>
<html lang="en">
<head>

    <title>Document</title>
    <style>
        .container{
            height: 300px;
            width: 300px;
            background: url("../DAY2/Images/rohit.webp") no-repeat center/cover;

        .text{

          <div class="text">.</div>
          <div class="content">Hello , opacity</div>
